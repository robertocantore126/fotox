<svg xmlns="http://www.w3.org/2000/svg" class="fx-sprite" width="0" height="0" aria-hidden="true" style="position:absolute;left:-9999px">
<defs>
  <style>
    /* le regole devono colpire le foglie e non il contenitore symbol:
       i valori calcolati sul symbol non entrano nell'albero ombra di use.
       Nota: qui non si possono usare parentesi angolari, il file e' XML. */
    .fx-sprite symbol > * {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .fx-sprite symbol .f { fill: currentColor; stroke: none; }
  </style>
</defs>

