[package]
name = "fx-app"
description = "The Fotox desktop app: winit window + wgpu + vendored Graphite CEF shell + engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fotox"
path = "src/main.rs"

[features]
default = ["accelerated_paint"]
# GPU texture sharing between CEF and wgpu (D3D11 shared handles on Windows).
# If the UI is black or flickers, run with --disable-ui-acceleration (M0-T03).
accelerated_paint = ["graphite-desktop-ui/accelerated_paint"]
# Release builds: bake ./ui into the binary instead of reading it from disk.
embedded_resources = ["graphite-desktop-ui/embedded_resources"]

[dependencies]
graphite-desktop-ui = { workspace = true }
wgpu-sync = { workspace = true }
fx-engine = { workspace = true }
fx-protocol = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
fd-lock = { workspace = true }
futures = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
pollster = { workspace = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_UI_ColorSystem",
	"Win32_System_Com",
	"Win32_System_Console",
	"Win32_UI_Shell",
] }
